[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relative-dml"
version = "0.1.0"
description = "Q-learners and cross-fitted relative treatment effects for binary outcomes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
paper = ["pandas>=2.0", "matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["relative_dml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
